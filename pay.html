<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正在跳转至支付...</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #4caf50;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        p {
            margin-top: 20px;
            color: #666;
        }
    </style>
    <script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>
</head>
<body>
    <div style="text-align: center;">
        <div class="loader"></div>
        <p>正在准备支付，请稍候...</p >
    </div>

    <script>
        // 替换为你的实际客户端令牌（从 Paddle 后台获取，以 live_ 开头）
        const CLIENT_TOKEN = 'live_9a9f986b6854d9b8cf44cb78dc1'; 
        const PRICE_ID = 'pri_01khtvpwwzc7z382xcqbbbrj5t'; // 你的价格 ID

        // 获取 URL 参数
        const urlParams = new URLSearchParams(window.location.search);
        const appUserId = urlParams.get('app_user_id') || 'guest_' + Math.random().toString(36).substr(2, 9);
        const redirectScheme = urlParams.get('redirect_scheme') || 'com.daxiongkungfu.lite://';

        // 初始化 Paddle（注意：environment 直接传给 Initialize）
        Paddle.Initialize({
            token: CLIENT_TOKEN,
            environment: 'production' // 正式环境，测试时可临时改为 'sandbox'
        });

        // 打开结账
        Paddle.Checkout.open({
            items: [{ priceId: PRICE_ID, quantity: 1 }],
            customer: { id: appUserId },
            successCallback: (data) => {
                // 支付成功，跳回 App
                window.location.href = redirectScheme + '?transaction_id=' + data.transactionId + '&paddle_success=1';
            },
            closeCallback: () => {
                // 用户关闭支付窗口，返回游戏首页
                window.location.href = 'https://lite.daxiongkungfu.com';
            }
        });
    </script>
</body>
</html>
