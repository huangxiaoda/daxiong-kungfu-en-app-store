<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>大熊学武功：功夫节奏挑战</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zhi+Mang+Xing&family=Press+Start+2P&display=swap" rel="stylesheet">
    <!-- Font Awesome for speaker icon and lock icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* ========== 页面整体样式 ========== */
        body {
            font-family: 'Zhi Mang Xing', cursive, sans-serif;
            background-color: #f7e0b5;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            flex-direction: column;
        }
        /* 游戏容器 */
        .game-container {
            width: 95%;
            max-width: 900px;
            height: 800px;
            background: linear-gradient(to bottom, #aed581, #dce775);
            border-radius: 30px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
            border: 8px solid #8bc34a;
            display: flex;
            flex-direction: column;
        }
        /* 顶部信息栏 */
        .info-bar {
            background-color: #558b2f;
            color: #fff;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.6em;
            font-weight: bold;
            border-bottom: 4px solid #33691e;
            font-family: 'Press Start 2P', cursive;
        }
        .info-bar span {
            margin: 0 15px;
        }
        .info-bar .level {
            font-size: 0.8em;
            color: #cddc39;
        }
        #bgMusicToggle {
            background: none;
            border: none;
            color: #33691e;
            font-size: 1.2em;
            cursor: pointer;
            padding: 5px;
            margin-left: 10px;
            transition: color 0.3s ease;
        }
        #bgMusicToggle:hover {
            color: #cddc39;
        }
        /* 新增：购买按钮样式 */
        .premium-button {
            background-color: #ffd700;
            color: #333;
            border: none;
            border-radius: 20px;
            padding: 5px 15px;
            font-size: 0.8em;
            font-family: 'Press Start 2P', cursive;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-left: 10px;
            white-space: nowrap;
        }
        .premium-button:hover {
            background-color: #ffc107;
        }
        .premium-button.purchased {
            background-color: #4caf50;
            color: white;
            cursor: default;
        }
        .premium-icon {
            color: #ffd700;
            margin-left: 5px;
        }
        .premium-icon.purchased {
            color: #4caf50;
        }
        /* 游戏区域 */
        .play-area {
            flex-grow: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
        }
        /* 师傅图标 */
        #master {
            position: absolute;
            top: -5px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 7em;
            color: rgba(0, 0, 0, 0.7);
            user-select: none;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.2);
            z-index: 5;
            line-height: 1;
        }
        /* 师傅的招式提示 */
        .master-move-display {
            position: absolute;
            top: 24%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(255, 255, 255, 0.9);
            padding: 12px 18px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            font-size: 3.5em;
            color: #d84315;
            font-weight: bold;
            text-align: center;
            min-width: 140px;
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s ease;
            z-index: 25;
            min-height: 55px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .master-move-display.show {
            opacity: 1;
            transform: translate(-50%, -50%);
        }
        .master-move-display .text {
            font-size: 0.4em;
            color: #333;
            margin-top: 5px;
        }
        /* 大熊图标 */
        #bear {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 9em;
            color: #6d4c41;
            user-select: none;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.2);
            z-index: 5;
            line-height: 1;
            display: block;
        }
        /* 玩家操作按钮 */
        .player-controls {
            position: absolute;
            bottom: -3px;
            left: 50%;
            transform: translateX(-50%);
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            padding: 15px;
            background-color: rgba(255, 255, 255, 0.8);
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            z-index: 10;
            max-width: 240px;
        }
        .action-button {
            width: 100px;
            height: 100px;
            background-color: #ffb300;
            border: 3px solid #fb8c00;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 3em;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease, box-shadow 0.2s ease;
            user-select: none;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 5px;
        }
        /* 修复：动作图标垂直居中 */
        .action-button span {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 40px;
            font-size: 0.9em;
            line-height: 1;
            font-family: 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif;
        }
        .action-button .text {
            margin-top: 8px;
            font-size: 0.7em;
            color: #333;
            text-align: center;
        }
        /* 游戏反馈提示 */
        .feedback {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 6em;
            font-weight: bold;
            color: #4CAF50;
            text-shadow: 4px 4px 8px rgba(0,0,0,0.6);
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s ease;
            z-index: 20;
            pointer-events: none;
            white-space: nowrap;
        }
        .feedback.show {
            opacity: 1;
            transform: translate(-50%, -70%);
        }
        .feedback.wrong {
            color: #F44336;
        }
        .feedback.combo {
            color: #FFEB3B;
            font-size: 7em;
            animation: pulse 0.5s ease-out forwards;
        }
        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            50% { transform: translate(-50%, -60%) scale(1.1); opacity: 1; }
            100% { transform: translate(-50%, -70%) scale(1); opacity: 0; }
        }
        /* 游戏结束或开始前的叠加层 */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 30;
            flex-direction: column;
            color: white;
            font-size: 2.2em;
            text-align: center;
            border-radius: 25px;
        }
        .overlay h2 {
            margin-bottom: 20px;
            font-size: 1.5em;
        }
        .overlay p {
            font-size: 0.8em;
            margin-top: -10px;
            margin-bottom: 30px;
        }
        .overlay button {
            background-color: #ffb300;
            color: #fff;
            border: none;
            padding: 15px 30px;
            border-radius: 30px;
            font-size: 1.5em;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .overlay button:hover {
            background-color: #ffa000;
        }
        .overlay.hidden {
            display: none !important;
            opacity: 0;
            pointer-events: none;
        }
        /* 放松音乐播放器样式 */
        .relax-music-player {
            width: calc(100% - 40px);
            background-color: #e0f2f7;
            padding: 15px 20px;
            border-radius: 15px;
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            border: 2px solid #b2ebf2;
            z-index: 5;
        }
        .relax-music-player h3 {
            margin-top: 0;
            margin-bottom: 10px;
            color: #00bcd4;
            font-size: 1.2em;
        }
        .relax-music-controls {
            display: flex;
            align-items: center;
            gap: 15px;
            width: 100%;
            justify-content: center;
            flex-wrap: wrap;
        }
        .relax-music-controls button {
            background-color: #4dd0e1;
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .relax-music-controls button:hover {
            background-color: #26c6da;
        }
        .relax-music-controls input[type="range"] {
            width: 100px;
            -webkit-appearance: none;
            height: 6px;
            background: #b2ebf2;
            border-radius: 3px;
            outline: none;
        }
        .relax-music-controls input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #00bcd4;
            cursor: pointer;
        }
        .relax-music-controls label {
            font-size: 0.9em;
            color: #00838f;
        }
        /* 音乐选择器布局调整 */
        .music-selector-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-bottom: 10px;
            width: 100%;
        }
        .music-selector {
            display: flex;
            align-items: center;
            gap: 5px;
            flex-shrink: 0;
            min-width: 180px;
            justify-content: center;
        }
        .music-selector label {
            font-size: 0.9em;
            color: #00838f;
            white-space: nowrap;
        }
        .music-selector select {
            padding: 5px 8px;
            border-radius: 8px;
            border: 1px solid #00bcd4;
            background-color: #e0f7fa;
            color: #00838f;
            font-size: 0.9em;
            cursor: pointer;
            flex-grow: 1;
            min-width: 80px;
            max-width: 180px;
            height: 35px;
            max-height: 35px;
        }
        /* 新增：付费音乐提示 */
        #premiumMusicHint {
            color: #4caf50;
            font-size: 0.8em;
            margin-left: 10px;
        }
        /* 响应式调整 */
        @media (max-width: 768px) {
            .game-container {
                height: 780px;
                width: 98%;
                border-radius: 20px;
            }
            .info-bar {
                padding: 2vh 4vw;
                font-size: min(4vw, 16px);
                box-sizing: border-box;
                width: 100%;
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
            }
            .info-bar::-webkit-scrollbar {
                display: none;
            }
            .premium-button {
                font-size: 0.6em;
                padding: 3px 8px;
            }
            #master {
                top: -5px;
                font-size: 5em;
            }
            .action-button {
                width: 70px;
                height: 70px;
                font-size: 2.2em;
            }
            .action-button span {
                height: 30px;
                font-size: 0.9em !important;
            }
            .action-button .text {
                font-size: 0.4em;
                line-height: 1.0;
            }
            #bear {
                bottom: 100px;
                font-size: 7em;
            }
            .master-move-display {
                top: 30%;
                font-size: 3em;
                padding: 8px 12px;
                min-height: 50px;
                min-width: 110px;
            }
            .player-controls {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
                padding: 15px;
                bottom: -5px;
                max-width: 200px;
            }
            .feedback {
                font-size: 4em;
            }
            .feedback.combo {
                font-size: 5em;
            }
            .overlay {
                font-size: 1.5em;
            }
            .overlay h2 {
                font-size: 1.2em;
            }
            .overlay p {
                font-size: 0.7em;
            }
            .overlay button {
                padding: 10px 20px;
                font-size: 1.2em;
            }
            .relax-music-player {
                padding: 10px 15px;
                margin-top: 15px;
            }
            .relax-music-player h3 {
                font-size: 1.1em;
            }
            .relax-music-controls {
                flex-direction: column;
                gap: 8px;
            }
            .relax-music-controls input[type="range"] {
                width: 80%;
            }
            .music-selector-row {
                flex-direction: column;
                gap: 10px;
                align-items: flex-start;
                width: 100%;
            }
            .music-selector {
                width: 100%;
                justify-content: flex-start;
            }
            .music-selector select {
                width: 100%;
                height: 32px;
                max-height: 32px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <!-- Game Background Music -->
        <audio id="game-bg-music" loop>Your browser does not support game background music.</audio>
        <div class="info-bar">
            <span>Time: <span id="timer">60</span>s</span>
            <span>Score: <span id="score">0</span></span>
            <span>Combo: <span id="combo">0</span></span>
            <span class="level">Level: <span id="level">Apprentice</span></span>
            <!-- 新增购买按钮 -->
            <button id="purchaseButton" class="premium-button">
                <i class="fas fa-crown"></i> 解锁高级版
            </button>
        </div>
        <div class="play-area">
            <div id="master" class="character">👨‍🏫</div>
            <div id="bear" class="character">🐻</div>
            <div id="masterMoveDisplay" class="master-move-display">
                <span class="emoji"></span>
                <div class="text"></div>
            </div>
            <div id="feedback" class="feedback"></div>
            <div class="player-controls">
                <button class="action-button" data-action="left-punch"><span>👊</span><div class="text">Left Punch</div></button>
                <button class="action-button" data-action="right-punch"><span>🤜</span><div class="text">Right Punch</div></button>
                <button class="action-button" data-action="up-kick"><span>🤸</span><div class="text">Up Kick</div></button>
                <button class="action-button" data-action="down-block"><span>🛡️</span><div class="text">Down Block</div></button>
                <button class="action-button" data-action="jump"><span>⬆️</span><div class="text">Jump</div></button>
                <button class="action-button" data-action="crouch"><span>⤵️</span><div class="text">Crouch</div></button>
            </div>
        </div>
        <div class="relax-music-player">
            <div class="music-selector-row">
                <div class="music-selector">
                    <label for="bgMusicSelector">Game Music:</label>
                    <select id="bgMusicSelector"></select>
                    <button id="bgMusicToggle" title="Toggle Background Music">
                        <i class="fas fa-volume-up"></i>
                    </button>
                </div>
                <div class="music-selector">
                    <label for="relaxMusicSelector">Relax Music:</label>
                    <select id="relaxMusicSelector"></select>
                </div>
                <!-- 新增付费音乐提示 -->
                <div id="premiumMusicHint" style="display:none;">
                    <i class="fas fa-check-circle"></i> 高级版已解锁
                </div>
            </div>
            <h3>🎵 Relax Music Controls 🎵</h3>
            <audio id="relax-audio" loop>Your browser does not support relax music.</audio>
            <div class="relax-music-controls">
                <button id="relaxPlayButton">Play</button>
                <button id="relaxPauseButton">Pause</button>
                <label for="relaxVolumeSlider">Volume:</label>
                <input type="range" id="relaxVolumeSlider" min="0" max="1" step="0.05" value="0.5">
            </div>
        </div>
        <div class="overlay" id="gameOverlay">
            <h2>Bear Kung Fu Challenge!</h2>
            <p>Watch the master demonstrate, then quickly tap the correct move!</p>
            <button id="startButton">Start Training</button>
        </div>
    </div>

    <script>
        // ==================== 原有游戏逻辑（保持不变） ====================
        // 元素获取
        const timerElement = document.getElementById('timer');
        const scoreElement = document.getElementById('score');
        const comboElement = document.getElementById('combo');
        const levelElement = document.getElementById('level');
        const masterMoveDisplay = document.getElementById('masterMoveDisplay');
        const masterMoveEmoji = masterMoveDisplay.querySelector('.emoji');
        const masterMoveText = masterMoveDisplay.querySelector('.text');
        const actionButtons = document.querySelectorAll('.action-button');
        const feedbackDisplay = document.getElementById('feedback');
        const gameOverlay = document.getElementById('gameOverlay');
        const startButton = document.getElementById('startButton');

        // Game music elements
        const gameBgMusic = document.getElementById('game-bg-music');
        const bgMusicToggle = document.getElementById('bgMusicToggle');
        const bgMusicIcon = bgMusicToggle.querySelector('i');
        const bgMusicSelector = document.getElementById('bgMusicSelector');
        gameBgMusic.volume = 0.3;
        let isGameBgMusicPlaying = false;

        // Relax music elements
        const relaxAudio = document.getElementById('relax-audio');
        const relaxPlayButton = document.getElementById('relaxPlayButton');
        const relaxPauseButton = document.getElementById('relaxPauseButton');
        const relaxVolumeSlider = document.getElementById('relaxVolumeSlider');
        const relaxMusicSelector = document.getElementById('relaxMusicSelector');
        relaxAudio.volume = relaxVolumeSlider.value;

        // Game State Variables
        let score = 0;
        let combo = 0;
        let timeLeft = 60;
        let gameInterval;
        let moveInterval;
        let isGameRunning = false;
        let expectedMoveId = null;
        let moveTimeout = null;
        let level = 1;

        // Game Data
        const moves = [
            { id: 'left-punch', emoji: '👊', text: 'Left Punch' },
            { id: 'right-punch', emoji: '🤜', text: 'Right Punch' },
            { id: 'up-kick', emoji: '🤸', text: 'Up Kick' },
            { id: 'down-block', emoji: '🛡️', text: 'Down Block' },
            { id: 'jump', emoji: '⬆️', text: 'Jump' },
            { id: 'crouch', emoji: '⤵️', text: 'Crouch' }
        ];

        const levels = [
            { scoreThreshold: 0, name: 'Apprentice', moveSpeed: 1500 },
            { scoreThreshold: 100, name: 'Bear Trainee', moveSpeed: 1200 },
            { scoreThreshold: 300, name: 'Kung Fu Bear', moveSpeed: 1000 },
            { scoreThreshold: 600, name: 'Disciple Master', moveSpeed: 800 },
            { scoreThreshold: 1000, name: 'Bear Overlord', moveSpeed: 600 }
        ];

        // Music lists - strictly according to knowledge base
        const gameMusicList = [
            { name: "Kung Fu Rhythm", src: "https://www.learningcontainer.com/wp-content/uploads/2020/02/Kalimba.mp3" },
            { name: "Exhilarating Strike", src: "music/Exhilarating Strike.mp3" },
            { name: "Mountain Forest Cultivation", src: "music/Mountain Forest Cultivation.mp3" }
        ];

        const relaxMusicList = [
            { name: "Joyful Chirp of Flocking Birds", src: "music/Joyful Chirp of Flocking Birds.mp3" },
            { name: "Mountain Stream's Flow", src: "music/Mountain Stream's Flow.mp3" },
            { name: "Ocean Waves", src: "https://www.bensound.com/bensound-music/bensound-relaxing.mp3" }
        ];

        // Music Playback Helper Functions
        async function loadAndPlayMusic(audioElement, src, shouldPlay) {
            console.log(`Attempting to load: ${src}, Expected to play: ${shouldPlay}`);
            audioElement.src = src;
            audioElement.load();
            if (shouldPlay) {
                try {
                    await new Promise((resolve, reject) => {
                        const onCanPlayThrough = () => {
                            console.log(`Audio canplaythrough: ${src}`);
                            audioElement.removeEventListener('canplaythrough', onCanPlayThrough);
                            audioElement.removeEventListener('loadeddata', onLoadedData);
                            audioElement.removeEventListener('error', onError);
                            resolve();
                        };
                        const onLoadedData = () => {
                            console.log(`Audio loadeddata: ${src}`);
                            audioElement.removeEventListener('canplaythrough', onCanPlayThrough);
                            audioElement.removeEventListener('loadeddata', onLoadedData);
                            audioElement.removeEventListener('error', onError);
                            resolve();
                        };
                        const onError = (e) => {
                            console.error(`Audio error during load/play: ${src}`, e);
                            audioElement.removeEventListener('canplaythrough', onCanPlayThrough);
                            audioElement.removeEventListener('loadeddata', onLoadedData);
                            audioElement.removeEventListener('error', onError);
                            reject(new Error(`Audio load error for ${src}: ${e.message || e.type}`));
                        };
                        audioElement.addEventListener('canplaythrough', onCanPlayThrough);
                        audioElement.addEventListener('loadeddata', onLoadedData);
                        audioElement.addEventListener('error', onError);
                        if (audioElement.readyState >= 4) {
                            onCanPlayThrough();
                        } else if (audioElement.readyState >= 2) {
                            onLoadedData();
                        }
                        setTimeout(() => {
                            reject(new Error(`Audio load timeout for ${src}`));
                        }, 7000);
                    });
                    await audioElement.play();
                    console.log(`Music ${src} played successfully.`);
                    return true;
                } catch (e) {
                    console.warn(`Music playback failed (URL: ${src}), may require user interaction or invalid link/format:`, e);
                    return false;
                }
            }
            return false;
        }

        // 原有 populateMusicSelectors 函数（稍后我们会扩展它）
        function populateMusicSelectors() {
            bgMusicSelector.innerHTML = '';
            relaxMusicSelector.innerHTML = '';

            gameMusicList.forEach((music) => {
                const option = document.createElement('option');
                option.value = music.src;
                option.textContent = music.name;
                bgMusicSelector.appendChild(option);
            });

            relaxMusicList.forEach((music) => {
                const option = document.createElement('option');
                option.value = music.src;
                option.textContent = music.name;
                relaxMusicSelector.appendChild(option);
            });

            if (gameMusicList.length > 0) {
                gameBgMusic.src = gameMusicList[0].src;
                gameBgMusic.load();
            }
            if (relaxMusicList.length > 0) {
                relaxAudio.src = relaxMusicList[0].src;
                relaxAudio.load();
            }
        }

        // Core Game Logic (保持不变)
        function resetGame() {
            score = 0;
            combo = 0;
            timeLeft = 60;
            level = 1;
            scoreElement.textContent = score;
            comboElement.textContent = combo;
            timerElement.textContent = timeLeft;
            levelElement.textContent = levels[0].name;

            if (gameInterval) {
                clearInterval(gameInterval);
                gameInterval = null;
            }
            if (moveInterval) {
                clearInterval(moveInterval);
                moveInterval = null;
            }
            if (moveTimeout) {
                clearTimeout(moveTimeout);
                moveTimeout = null;
            }
            isGameRunning = false;
            expectedMoveId = null;
            masterMoveDisplay.classList.remove('show');
            feedbackDisplay.classList.remove('show', 'correct', 'wrong', 'combo');
            feedbackDisplay.textContent = '';
            enableActionButtons(true);
            gameBgMusic.pause();
            gameBgMusic.currentTime = 0;
            isGameBgMusicPlaying = false;
            bgMusicIcon.classList.remove('fa-volume-mute');
            bgMusicIcon.classList.add('fa-volume-up');
        }

        async function startGame() {
            console.log("startGame called.");
            if (isGameRunning) {
                console.log("Game is already running or starting, ignoring duplicate call.");
                return;
            }
            resetGame();
            gameOverlay.classList.add('hidden');
            await new Promise(resolve => setTimeout(resolve, 100));
            isGameRunning = true;

            try {
                gameInterval = setInterval(updateTimer, 1000);
                console.log("Game interval set with ID:", gameInterval);
            } catch (error) {
                console.error("Failed to set gameInterval:", error);
                isGameRunning = false;
                gameOverlay.classList.remove('hidden');
                return;
            }

            startNewMoveSequence();
            if (isGameBgMusicPlaying) {
                await loadAndPlayMusic(gameBgMusic, bgMusicSelector.value, true);
            }
            console.log("startGame finished. Game is running.");
        }

        function updateTimer() {
            if (!isGameRunning) {
                if (gameInterval) {
                    clearInterval(gameInterval);
                    gameInterval = null;
                }
                console.log("updateTimer called but game is not running.");
                return;
            }
            timeLeft--;
            timerElement.textContent = timeLeft;
            console.log("Time left:", timeLeft, " (isGameRunning:", isGameRunning, ")");
            if (timeLeft <= 0) {
                endGame();
            }
        }

        function startNewMoveSequence() {
            if (moveInterval) clearInterval(moveInterval);
            let currentLevelData = levels[0];
            for (let i = levels.length - 1; i >= 0; i--) {
                if (score >= levels[i].scoreThreshold) {
                    currentLevelData = levels[i];
                    level = i + 1;
                    break;
                }
            }
            levelElement.textContent = currentLevelData.name;
            moveInterval = setInterval(showNextMove, currentLevelData.moveSpeed);
            showNextMove();
        }

        function showNextMove() {
            if (!isGameRunning) return;
            clearTimeout(moveTimeout);
            if (expectedMoveId !== null) {
                handleWrongGuess(null);
            }
            masterMoveDisplay.classList.remove('show');
            const randomIndex = Math.floor(Math.random() * moves.length);
            const nextMove = moves[randomIndex];
            masterMoveEmoji.textContent = nextMove.emoji;
            masterMoveText.textContent = nextMove.text;
            masterMoveDisplay.classList.add('show');
            expectedMoveId = nextMove.id;
            actionButtons.forEach(button => {
                button.disabled = false;
                button.classList.remove('correct', 'wrong');
            });
            const currentLevelData = levels.find(l => score >= l.scoreThreshold) || levels[levels.length - 1];
            moveTimeout = setTimeout(() => {
                if (expectedMoveId !== null && isGameRunning) {
                    handleWrongGuess(null);
                }
            }, currentLevelData.moveSpeed - 200);
        }

        function handlePlayerAction(event) {
            console.log("Player action clicked. Expected:", expectedMoveId, "Clicked:", event.currentTarget.dataset.action);
            if (!isGameRunning || expectedMoveId === null) {
                console.log("Action ignored: Not running or no expected move.");
                return;
            }
            clearTimeout(moveTimeout);
            const clickedAction = event.currentTarget.dataset.action;
            const isCorrect = (clickedAction === expectedMoveId);
            expectedMoveId = null;
            masterMoveDisplay.classList.remove('show');
            enableActionButtons(false);
            if (isCorrect) {
                console.log("Correct!");
                score += (10 + combo * 2);
                combo++;
                scoreElement.textContent = score;
                comboElement.textContent = combo;
                if (combo > 1) {
                    showFeedback(`Combo x${combo}!`, 'combo');
                } else {
                    showFeedback('Correct!', 'correct');
                }
                const nextLevelThreshold = levels[level] ? levels[level].scoreThreshold : Infinity;
                if (score >= nextLevelThreshold) {
                    level++;
                    levelElement.textContent = levels[level-1].name;
                    startNewMoveSequence();
                    showFeedback(`Level Up!`, 'combo');
                }
            } else {
                console.log("Wrong!");
                handleWrongGuess(event.currentTarget);
            }
        }

        function handleWrongGuess(clickedButton) {
            score = Math.max(0, score - 5);
            combo = 0;
            scoreElement.textContent = score;
            comboElement.textContent = combo;
            showFeedback('Wrong!', 'wrong');
            if (clickedButton) {
                clickedButton.classList.add('wrong');
            }
            expectedMoveId = null;
        }

        function showFeedback(text, type) {
            feedbackDisplay.classList.remove('show', 'correct', 'wrong', 'combo');
            feedbackDisplay.textContent = text;
            feedbackDisplay.classList.add('show');
            if (type) {
                feedbackDisplay.classList.add(type);
            }
            setTimeout(() => {
                feedbackDisplay.classList.remove('show');
            }, 1000);
        }

        function enableActionButtons(enable) {
            actionButtons.forEach(button => {
                button.disabled = !enable;
            });
        }

        function endGame() {
            clearInterval(gameInterval);
            clearInterval(moveInterval);
            clearTimeout(moveTimeout);
            isGameRunning = false;
            enableActionButtons(false);
            masterMoveDisplay.classList.remove('show');
            expectedMoveId = null;
            gameBgMusic.pause();
            gameBgMusic.currentTime = 0;
            isGameBgMusicPlaying = false;
            bgMusicIcon.classList.remove('fa-volume-mute');
            bgMusicIcon.classList.add('fa-volume-up');
            gameOverlay.classList.remove('hidden');
            gameOverlay.querySelector('h2').textContent = 'Training Ended!';
            gameOverlay.querySelector('p').textContent = `Your final score is: ${score}, and Bear reached the ${levelElement.textContent} realm!`;
            gameOverlay.querySelector('button').textContent = 'Play Again';
        }

        // Event Listeners (部分保留，部分稍后添加)
        actionButtons.forEach(button => {
            button.addEventListener('click', handlePlayerAction);
        });

        bgMusicToggle.addEventListener('click', async () => {
            if (gameBgMusic.paused) {
                const success = await loadAndPlayMusic(gameBgMusic, bgMusicSelector.value, true);
                if (success) {
                    isGameBgMusicPlaying = true;
                    bgMusicIcon.classList.remove('fa-volume-mute');
                    bgMusicIcon.classList.add('fa-volume-up');
                    if (!relaxAudio.paused) {
                        relaxAudio.pause();
                    }
                }
            } else {
                gameBgMusic.pause();
                isGameBgMusicPlaying = false;
                bgMusicIcon.classList.remove('fa-volume-up');
                bgMusicIcon.classList.add('fa-volume-mute');
            }
        });

        bgMusicSelector.addEventListener('change', async (e) => {
            const newSrc = e.target.value;
            const wasPlaying = isGameBgMusicPlaying;
            gameBgMusic.pause();
            gameBgMusic.currentTime = 0;
            const success = await loadAndPlayMusic(gameBgMusic, newSrc, wasPlaying);
            if (success) {
                isGameBgMusicPlaying = true;
                bgMusicIcon.classList.remove('fa-volume-mute');
                bgMusicIcon.classList.add('fa-volume-up');
                if (!relaxAudio.paused) {
                    relaxAudio.pause();
                }
            } else {
                isGameBgMusicPlaying = false;
                bgMusicIcon.classList.remove('fa-volume-up');
                bgMusicIcon.classList.add('fa-volume-mute');
            }
        });

        relaxPlayButton.addEventListener('click', async () => {
            const success = await loadAndPlayMusic(relaxAudio, relaxMusicSelector.value, true);
            if (success) {
                if (!gameBgMusic.paused) {
                    gameBgMusic.pause();
                    isGameBgMusicPlaying = false;
                    bgMusicIcon.classList.remove('fa-volume-up');
                    bgMusicIcon.classList.add('fa-volume-mute');
                }
            }
        });

        relaxPauseButton.addEventListener('click', () => {
            relaxAudio.pause();
        });

        relaxVolumeSlider.addEventListener('input', () => {
            relaxAudio.volume = relaxVolumeSlider.value;
        });

        relaxMusicSelector.addEventListener('change', async (e) => {
            const newSrc = e.target.value;
            const wasRelaxPlaying = !relaxAudio.paused;
            relaxAudio.pause();
            relaxAudio.currentTime = 0;
            const success = await loadAndPlayMusic(relaxAudio, newSrc, wasRelaxPlaying);
            if (success) {
                if (!gameBgMusic.paused) {
                    gameBgMusic.pause();
                    isGameBgMusicPlaying = false;
                    bgMusicIcon.classList.remove('fa-volume-up');
                    bgMusicIcon.classList.add('fa-volume-mute');
                }
            }
        });

        // ==================== Paddle支付集成（新增） ====================
        // 支付配置 - 请务必替换为你的实际地址
        const PADDLE_CHECKOUT_URL = "https://your-paddle-checkout-domain.vercel.app"; // 替换为你部署的支付页面
        const APP_SCHEME = "daxiongkungfu://"; // 替换为你的App URL Scheme

        // 用户状态
        let isPremium = localStorage.getItem('isPremium') === 'true';
        let appUserId = localStorage.getItem('appUserId') || 'guest_' + Math.random().toString(36).substr(2, 9);

        // 付费音乐列表
        const premiumMusicList = [
            { name: "🔥 史诗战斗 (付费)", src: "https://www.bensound.com/bensound-music/bensound-epic.mp3" },
            { name: "🎻 东方韵味 (付费)", src: "https://www.bensound.com/bensound-music/bensound-theelevatorbossanova.mp3" }
        ];

        // 获取新增的DOM元素
        const purchaseButton = document.getElementById('purchaseButton');
        const premiumMusicHint = document.getElementById('premiumMusicHint');

        // 扩展populateMusicSelectors以支持付费音乐
        const originalPopulateMusicSelectors = populateMusicSelectors;
        populateMusicSelectors = function(includePremium = isPremium) {
            // 先调用原函数填充免费音乐
            originalPopulateMusicSelectors();
            // 如果已购买，添加付费音乐到放松音乐选择器
            if (includePremium) {
                premiumMusicList.forEach((music) => {
                    const option = document.createElement('option');
                    option.value = music.src;
                    option.textContent = music.name;
                    option.classList.add('premium'); // 可选样式
                    relaxMusicSelector.appendChild(option);
                });
            }
        };

        // 更新UI根据付费状态
        function updatePremiumUI() {
            if (isPremium) {
                purchaseButton.classList.add('purchased');
                purchaseButton.innerHTML = '<i class="fas fa-check"></i> 已解锁';
                purchaseButton.disabled = true;
                premiumMusicHint.style.display = 'inline-block';
                // 重新填充音乐列表（包含付费音乐）
                populateMusicSelectors(true);
            } else {
                purchaseButton.classList.remove('purchased');
                purchaseButton.innerHTML = '<i class="fas fa-crown"></i> 解锁高级版';
                purchaseButton.disabled = false;
                premiumMusicHint.style.display = 'none';
                populateMusicSelectors(false);
            }
        }

        // 打开Paddle支付页面
        function openPaddleCheckout() {
            const checkoutUrl = new URL(PADDLE_CHECKOUT_URL);
            checkoutUrl.searchParams.append('app_user_id', appUserId);
            checkoutUrl.searchParams.append('redirect_scheme', APP_SCHEME);
            // 可选：传递商品ID等
            window.location.href = checkoutUrl.toString();
        }

        // 支付成功回调（供原生App调用）
        window.purchaseSuccess = function(transactionId) {
            console.log('Purchase success! Transaction ID:', transactionId);
            isPremium = true;
            localStorage.setItem('isPremium', 'true');
            if (transactionId) {
                localStorage.setItem('lastTransactionId', transactionId);
            }
            updatePremiumUI();
            showFeedback('购买成功！感谢支持', 'combo');
        };

        // 检查URL参数中是否有支付成功信息（如果支付页面重定向回当前页）
        function checkForPurchaseResult() {
            const urlParams = new URLSearchParams(window.location.search);
            const transactionId = urlParams.get('transaction_id');
            const success = urlParams.get('paddle_success');
            if (success === '1' && transactionId) {
                // 清除URL参数
                window.history.replaceState({}, document.title, window.location.pathname);
                window.purchaseSuccess(transactionId);
            }
        }

        // 购买按钮点击事件
        purchaseButton.addEventListener('click', () => {
            if (!isPremium) {
                openPaddleCheckout();
            }
        });

        // 重新定义DOMContentLoaded事件（合并原有逻辑和支付初始化）
        document.addEventListener('DOMContentLoaded', () => {
            // 原有初始化
            populateMusicSelectors(false); // 初始不显示付费音乐
            gameOverlay.classList.remove('hidden');
            startButton.addEventListener('click', startGame);
            resetGame();
            // 支付初始化
            updatePremiumUI();
            checkForPurchaseResult();
        });

        // 保存用户ID到localStorage
        if (!localStorage.getItem('appUserId')) {
            localStorage.setItem('appUserId', appUserId);
        }

        console.log('Paddle payment integration loaded. Premium status:', isPremium);
    </script>
</body>
</html>
