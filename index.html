<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>大熊学武功：功夫节奏挑战</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zhi+Mang+Xing&family=Press+Start+2P&display=swap" rel="stylesheet">
    <!-- Font Awesome for speaker icon and lock icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* 原有样式保持不变，新增部分如下 */
        /* 购买按钮样式 */
        .premium-button {
            background-color: #ffd700;
            color: #333;
            border: none;
            border-radius: 20px;
            padding: 5px 15px;
            font-size: 0.8em;
            font-family: 'Press Start 2P', cursive;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-left: 10px;
            white-space: nowrap;
        }
        .premium-button:hover {
            background-color: #ffc107;
        }
        .premium-button.purchased {
            background-color: #4caf50;
            color: white;
            cursor: default;
        }
        .premium-icon {
            color: #ffd700;
            margin-left: 5px;
        }
        .premium-icon.purchased {
            color: #4caf50;
        }
        /* 付费音乐锁定样式 */
        .music-selector select option.locked {
            color: #999;
            background-color: #f0f0f0;
            position: relative;
        }
        .music-selector select option.locked::after {
            content: " 🔒";
            font-family: "Font Awesome 6 Free";
            font-weight: 900;
        }
        /* 适应移动端 */
        @media (max-width: 768px) {
            .premium-button {
                font-size: 0.6em;
                padding: 3px 8px;
            }
        }
        /* 其余原有样式... 保留原有全部样式，以下为省略，实际替换时请保留原有完整样式 */
        /* ... 原有所有样式保持不变 ... */
    </style>
</head>
<body>
    <div class="game-container">
        <!-- Game Background Music -->
        <audio id="game-bg-music" loop>Your browser does not support game background music.</audio>
        <div class="info-bar">
            <span>Time: <span id="timer">60</span>s</span>
            <span>Score: <span id="score">0</span></span>
            <span>Combo: <span id="combo">0</span></span>
            <span class="level">Level: <span id="level">Apprentice</span></span>
            <!-- 新增：购买按钮 -->
            <button id="purchaseButton" class="premium-button">
                <i class="fas fa-crown"></i> 解锁高级版
            </button>
        </div>
        <div class="play-area">
            <!-- Master Icon -->
            <div id="master" class="character">👨‍🏫</div>
            <!-- Bear Icon -->
            <div id="bear" class="character">🐻</div>
            <div id="masterMoveDisplay" class="master-move-display">
                <span class="emoji"></span>
                <div class="text"></div>
            </div>
            <div id="feedback" class="feedback"></div>
            <div class="player-controls">
                <button class="action-button" data-action="left-punch"><span>👊</span><div class="text">Left Punch</div></button>
                <button class="action-button" data-action="right-punch"><span>🤜</span><div class="text">Right Punch</div></button>
                <button class="action-button" data-action="up-kick"><span>🤸</span><div class="text">Up Kick</div></button>
                <button class="action-button" data-action="down-block"><span>🛡️</span><div class="text">Down Block</div></button>
                <button class="action-button" data-action="jump"><span>⬆️</span><div class="text">Jump</div></button>
                <button class="action-button" data-action="crouch"><span>⤵️</span><div class="text">Crouch</div></button>
            </div>
        </div>
        <div class="relax-music-player">
            <div class="music-selector-row">
                <div class="music-selector">
                    <label for="bgMusicSelector">Game Music:</label>
                    <select id="bgMusicSelector"></select>
                    <button id="bgMusicToggle" title="Toggle Background Music">
                        <i class="fas fa-volume-up"></i>
                    </button>
                </div>
                <div class="music-selector">
                    <label for="relaxMusicSelector">Relax Music:</label>
                    <select id="relaxMusicSelector"></select>
                </div>
                <!-- 新增：付费音乐提示 -->
                <div id="premiumMusicHint" style="display:none; color:#4caf50; font-size:0.8em;">
                    <i class="fas fa-check-circle"></i> 高级版已解锁
                </div>
            </div>
            <h3>🎵 Relax Music Controls 🎵</h3>
            <audio id="relax-audio" loop>Your browser does not support relax music.</audio>
            <div class="relax-music-controls">
                <button id="relaxPlayButton">Play</button>
                <button id="relaxPauseButton">Pause</button>
                <label for="relaxVolumeSlider">Volume:</label>
                <input type="range" id="relaxVolumeSlider" min="0" max="1" step="0.05" value="0.5">
            </div>
        </div>
        <div class="overlay" id="gameOverlay">
            <h2>Bear Kung Fu Challenge!</h2>
            <p>Watch the master demonstrate, then quickly tap the correct move!</p>
            <button id="startButton">Start Training</button>
        </div>
    </div>

    <script>
        // ==================== 原有代码开始 ====================
        // 原有变量和函数保持不变，我们将在适当位置插入新代码
        // 为了清晰，这里保留原有全部代码（省略号表示实际替换时请保留原完整代码）
        // 以下仅列出新增和修改的部分，完整代码见最后

        // ... 原有代码全部保留 ...

        // ==================== 新增：Paddle支付相关代码 ====================

        // 支付配置
        const PADDLE_CHECKOUT_URL = "https://your-paddle-checkout-domain.vercel.app"; // 替换为你部署的支付页面域名
        const APP_SCHEME = "daxiongkungfu://"; // 你的App自定义URL Scheme，必须与Info.plist一致

        // 用户状态
        let isPremium = localStorage.getItem('isPremium') === 'true'; // 是否已购买
        let appUserId = localStorage.getItem('appUserId') || 'guest_' + Math.random().toString(36).substr(2, 9);

        // 新增：付费音乐列表（仅在购买后显示）
        const premiumMusicList = [
            { name: "🔥 史诗战斗 (付费)", src: "https://www.bensound.com/bensound-music/bensound-epic.mp3" },
            { name: "🎻 东方韵味 (付费)", src: "https://www.bensound.com/bensound-music/bensound-theelevatorbossanova.mp3" }
        ];

        // 获取DOM元素
        const purchaseButton = document.getElementById('purchaseButton');
        const premiumMusicHint = document.getElementById('premiumMusicHint');

        // 初始化购买按钮状态
        function updatePremiumUI() {
            if (isPremium) {
                purchaseButton.classList.add('purchased');
                purchaseButton.innerHTML = '<i class="fas fa-check"></i> 已解锁';
                purchaseButton.disabled = true;
                premiumMusicHint.style.display = 'inline-block';
                // 重新填充音乐列表，包含付费音乐
                populateMusicSelectors(true);
            } else {
                purchaseButton.classList.remove('purchased');
                purchaseButton.innerHTML = '<i class="fas fa-crown"></i> 解锁高级版';
                purchaseButton.disabled = false;
                premiumMusicHint.style.display = 'none';
                populateMusicSelectors(false);
            }
        }

        // 重写populateMusicSelectors以支持付费音乐
        const originalPopulate = populateMusicSelectors; // 保存原函数
        populateMusicSelectors = function(includePremium = isPremium) {
            // 清空原有选项
            bgMusicSelector.innerHTML = '';
            relaxMusicSelector.innerHTML = '';

            // 添加免费游戏音乐
            gameMusicList.forEach((music) => {
                const option = document.createElement('option');
                option.value = music.src;
                option.textContent = music.name;
                bgMusicSelector.appendChild(option);
            });

            // 添加免费放松音乐
            relaxMusicList.forEach((music) => {
                const option = document.createElement('option');
                option.value = music.src;
                option.textContent = music.name;
                relaxMusicSelector.appendChild(option);
            });

            // 如果是高级版，添加付费音乐
            if (includePremium) {
                premiumMusicList.forEach((music) => {
                    const option = document.createElement('option');
                    option.value = music.src;
                    option.textContent = music.name;
                    option.classList.add('premium'); // 可以加个样式
                    relaxMusicSelector.appendChild(option); // 付费音乐加到放松音乐列表
                });
            }

            // 设置默认选中
            if (gameMusicList.length > 0) {
                gameBgMusic.src = gameMusicList[0].src;
                gameBgMusic.load();
            }
            if (relaxMusicList.length > 0) {
                relaxAudio.src = relaxMusicList[0].src;
                relaxAudio.load();
            } else if (includePremium && premiumMusicList.length > 0) {
                relaxAudio.src = premiumMusicList[0].src;
                relaxAudio.load();
            }
        };

        // 打开Paddle支付页面
        function openPaddleCheckout() {
            // 构造支付页面URL，传递用户ID和App Scheme用于返回
            const checkoutUrl = new URL(PADDLE_CHECKOUT_URL);
            checkoutUrl.searchParams.append('app_user_id', appUserId);
            checkoutUrl.searchParams.append('redirect_scheme', APP_SCHEME);
            // 可选：传递商品ID等，根据你的支付页面需要
            // 跳转到支付页面（在WebView中打开）
            window.location.href = checkoutUrl.toString();
        }

        // 支付成功回调（供原生App调用）
        window.purchaseSuccess = function(transactionId) {
            console.log('Purchase success! Transaction ID:', transactionId);
            isPremium = true;
            localStorage.setItem('isPremium', 'true');
            // 可选保存transactionId
            localStorage.setItem('lastTransactionId', transactionId);
            updatePremiumUI();
            // 显示成功提示
            showFeedback('购买成功！感谢支持', 'combo');
        };

        // 监听来自支付页面的返回（如果支付页面重定向回当前页面，通过URL参数）
        function checkForPurchaseResult() {
            const urlParams = new URLSearchParams(window.location.search);
            const transactionId = urlParams.get('transaction_id');
            const success = urlParams.get('paddle_success');
            if (success === '1' && transactionId) {
                // 清除URL参数，避免重复触发
                window.history.replaceState({}, document.title, window.location.pathname);
                window.purchaseSuccess(transactionId);
            }
        }

        // 购买按钮点击事件
        purchaseButton.addEventListener('click', () => {
            if (!isPremium) {
                openPaddleCheckout();
            }
        });

        // 页面加载时检查URL参数和本地状态
        document.addEventListener('DOMContentLoaded', () => {
            // 原有初始化
            originalPopulate(); // 先填充免费音乐
            gameOverlay.classList.remove('hidden');
            startButton.addEventListener('click', startGame);
            resetGame();
            // 新增：更新UI
            updatePremiumUI();
            checkForPurchaseResult();
        });

        // 注意：原有代码中已经定义了populateMusicSelectors，需要将其重命名或覆盖
        // 因此我们在上面重新定义了populateMusicSelectors，并将原有函数保存为originalPopulate
        // 确保原有代码中调用populateMusicSelectors的地方都使用新函数
        // 如果原有代码中有多处调用，请确保它们都使用新的函数。这里我们已经覆盖了。

        // ==================== 原有代码结束 ====================
        // 以下为原有代码的完整保留（略，实际使用时请保留你原来的所有代码）
        // 请务必将你的原代码全部保留，并将以上新增代码插入到合适位置（例如在原有变量定义之后）
    </script>
</body>
</html>
