    <style>

     /* 添加一些动画效果 */
#applePayButton {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
}

#startButton {
    background: #4CAF50;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 15px 30px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.3s;
}

#startButton:hover {
    background: #45a049;
}

#purchaseStatus {
    font-size: 16px;
    animation: fadeIn 0.5s;
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

/* Apple Pay 按钮的脉冲动画效果（可选） */
@keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(0,0,0,0.3); }
    70% { box-shadow: 0 0 0 10px rgba(0,0,0,0); }
    100% { box-shadow: 0 0 0 0 rgba(0,0,0,0); }
}

#applePayBtn {
    animation: pulse 2s infinite;
}
      
        /* 页面整体样式 */
        body {
            font-family: 'Zhi Mang Xing', cursive, sans-serif;
            background-color: #f7e0b5;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            flex-direction: column;
        }
        
        /* 游戏容器 */
        .game-container {
            width: 95%;
            max-width: 900px;
            height: 800px;
            background: linear-gradient(to bottom, #aed581, #dce775);
            border-radius: 30px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
            border: 8px solid #8bc34a;
            display: flex;
            flex-direction: column;
        }
        
        /* 顶部信息栏 */
        .info-bar {
            background-color: #558b2f;
            color: #fff;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.6em;
            font-weight: bold;
            border-bottom: 4px solid #33691e;
            font-family: 'Press Start 2P', cursive;
        }
        
        .info-bar span {
            margin: 0 15px;
        }
        
        .info-bar .level {
            font-size: 0.8em;
            color: #cddc39;
        }
        
         #bgMusicToggle {
            background: none;
            border: none;
            color: white;
            font-size: 1.2em;
            cursor: pointer;
            padding: 5px;
            margin-left: 10px;
            transition: color 0.3s ease;
            flex-shrink: 0;

        }
        
        #bgMusicToggle:hover {
            color: #33691e;

        }
        
        /* 游戏区域 */
        .play-area {
            flex-grow: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
        }
        
        /* 师傅图标 */
        #master {
            position: absolute;
            top: -5px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 7em;
            color: rgba(0, 0, 0, 0.7);
            user-select: none;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.2);
            z-index: 5;
            line-height: 1;
        }
        
        /* 师傅的招式提示 */
           .master-move-display {
            position: absolute;
            top: 24%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(255, 255, 255, 0.9);
            padding: 12px 18px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            font-size: 3.5em;
            color: #d84315;
            font-weight: bold;
            text-align: center;
            min-width: 140px;
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s ease;
            z-index: 25;
            min-height: 55px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .master-move-display.show {
            opacity: 1;
            transform: translate(-50%, -50%);
        }
        
        .master-move-display .text {
            font-size: 0.4em;
            color: #333;
            margin-top: 5px;
        }
        
        /* 大熊图标 */
        #bear {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 9em;
            color: #6d4c41;
            user-select: none;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.2);
            z-index: 5;
            line-height: 1;
            display: block;
        }
        
        /* 玩家操作按钮 */
         .player-controls {
            position: absolute;
            bottom: -3px;
            left: 50%;
            transform: translateX(-50%);
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            padding: 15px;
            background-color: rgba(255, 255, 255, 0.8);
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            z-index: 10;
            max-width: 240px;
        }

    .action-button {
    width: 100px;
    height: 100px;
    background-color: #ffb300;
    border: 3px solid #fb8c00;
    border-radius: 15px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 3em;
    color: white;
    font-weight: bold;
    cursor: pointer;
    transition: background-color 0.2s ease, transform 0.1s ease, box-shadow 0.2s ease;
    user-select: none;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    padding: 5px;
}

/* 修复：动作图标垂直居中 */
.action-button span {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 40px;
    font-size: 0.9em;
    line-height: 1;
    font-family: 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif;
}

.action-button .text {
    margin-top: 8px;
    font-size: 0.7em;
    color: #333;
    text-align: center;
}

        
        /* 游戏反馈提示 */
        .feedback {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 6em;
            font-weight: bold;
            color: #4CAF50;
            text-shadow: 4px 4px 8px rgba(0,0,0,0.6);
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s ease;
            z-index: 20;
            pointer-events: none;
            white-space: nowrap;
        }
        
        .feedback.show {
            opacity: 1;
            transform: translate(-50%, -70%);
        }
        
        .feedback.wrong {
            color: #F44336;
        }
        
        .feedback.combo {
            color: #FFEB3B;
            font-size: 7em;
            animation: pulse 0.5s ease-out forwards;
        }
        
        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            50% { transform: translate(-50%, -60%) scale(1.1); opacity: 1; }
            100% { transform: translate(-50%, -70%) scale(1); opacity: 0; }
        }
      
        /* 游戏结束或开始前的叠加层 */
       .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 30;
            flex-direction: column;
            color: white;
            font-size: 2.2em;
            text-align: center;
            border-radius: 25px;
        }
        
        .overlay h2 {
            margin-bottom: 20px;
            font-size: 1.5em;
        }
        
        .overlay p {
            font-size: 0.8em;
            margin-top: -10px;
            margin-bottom: 30px;
        }
        
        .overlay button {
            background-color: #ffb300;
            color: #fff;
            border: none;
            padding: 15px 30px;
            border-radius: 30px;
            font-size: 1.5em;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        
        .overlay button:hover {
            background-color: #ffa000;
        }
        
        .overlay.hidden {
            display: none !important;
            opacity: 0;
            pointer-events: none;
        }

          /* 放松音乐播放器样式 */
        .relax-music-player {
            width: calc(100% - 40px);
            background-color: #e0f2f7;
            padding: 15px 20px;
            border-radius: 15px;
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            border: 2px solid #b2ebf2;
            z-index: 5;
        }
        
        .relax-music-player h3 {
            margin-top: 0;
            margin-bottom: 10px;
            color: #00bcd4;
            font-size: 1.2em;
        }
        
        .relax-music-controls {
            display: flex;
            align-items: center;
            gap: 15px;
            width: 100%;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .relax-music-controls button {
            background-color: #4dd0e1;
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        
        .relax-music-controls button:hover {
            background-color: #26c6da;
        }
        
        .relax-music-controls input[type="range"] {
            width: 100px;
            -webkit-appearance: none;
            height: 6px;
            background: #b2ebf2;
            border-radius: 3px;
            outline: none;
        }
        
        .relax-music-controls input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #00bcd4;
            cursor: pointer;
        }
        
        .relax-music-controls label {
            font-size: 0.9em;
            color: #00838f;
        }
        
        /* 音乐选择器布局调整 */
        .music-selector-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-bottom: 10px;
            width: 100%;
        }
        
        .music-selector {
            display: flex;
            align-items: center;
            gap: 5px;
            flex-shrink: 0;
            min-width: 180px;
            justify-content: center;
        }
        
        .music-selector label {
            font-size: 0.9em;
            color: #00838f;
            white-space: nowrap;
        }
        
        .music-selector select {
            padding: 5px 8px;
            border-radius: 8px;
            border: 1px solid #00bcd4;
            background-color: #e0f7fa;
            color: #00838f;
            font-size: 0.9em;
            cursor: pointer;
            flex-grow: 1;
            min-width: 80px;
            max-width: 180px;
        }

         /* 新增：固定高度，启用滚动 */
            height: 35px;
            max-height: 35px;
        }

        /* 🎯 新增动态高度展开样式 */
        .music-selector select:focus {
            height: auto;
            max-height: 400px; /* 固定高度 */
            overflow-y: auto; /* 启用滚动 */
            position: absolute; /* 改为绝对定位 */
            top: 100%; /* 在选择器下方展开 */
            left: 0;
            width: 100%;
            z-index: 1000; /* 提高层级 */
            background: #e0f7fa;
            border: 1px solid #00bcd4;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        /* 选项样式优化 */
        .music-selector select option {
            padding: 8px 12px;
            font-size: 0.85em;
            background-color: #e0f7fa;
            border-bottom: 1px solid #b2ebf2;
        }

        .music-selector select option:checked {
            background-color: #00bcd4;
            color: white;
        }

        .music-selector select option:hover {
            background-color: #b2ebf2;
        }

        
/* 确保emoji正确显示 */

    <script>
       
      // ==================== 支付相关代码 ====================

// 检测是否在iOS设备上
function isIOSDevice() {
    return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
}

// 检测是否支持Apple Pay
function isApplePayAvailable() {
    return window.ApplePaySession && ApplePaySession.canMakePayments();
}

// 支付成功后的处理函数
function handlePurchaseSuccess() {
    console.log("Payment successful, starting game");
    
    // 隐藏支付按钮容器（整个移除，避免重复点击）
    const applePayContainer = document.getElementById('applePayButton');
    if (applePayContainer) {
        applePayContainer.innerHTML = ''; // 清空内容
        applePayContainer.style.display = 'none';
    }
    
    // 显示支付成功状态
    const purchaseStatus = document.getElementById('purchaseStatus');
    if (purchaseStatus) {
        purchaseStatus.style.display = 'block';
    
        // 新增：显示开始按钮（“Play Again”）
    const startButton = document.getElementById('startButton');
    if (startButton) {
        startButton.style.display = 'inline-block'; // 与原有样式保持一致
    }
    }

    // 延迟1秒后自动开始游戏
    setTimeout(async function() {
        console.log("自动调用 startGame()");
        
        // **【新增】隐藏支付成功提示**
        const purchaseStatus = document.getElementById('purchaseStatus');
        if (purchaseStatus) {
            purchaseStatus.style.display = 'none';
        }

        const gameOverlay = document.getElementById('gameOverlay');
        if (gameOverlay) {
            gameOverlay.classList.add('hidden');
        }
        
        if (typeof startGame === 'function') {
            await startGame();
        } else {
            console.error("错误：找不到 startGame 函数！");
        }
    }, 1000);
}

        // 模拟Apple Pay支付流程
function simulateApplePayPayment() {
    return new Promise((resolve, reject) => {
        console.log("模拟Apple Pay支付流程...");
        
        // 创建支付中界面
        const overlay = document.createElement('div');
        overlay.id = 'paymentOverlay';
        overlay.style.cssText = `
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        `;
        overlay.innerHTML = `
            <div style="
                background: white;
                padding: 30px;
                border-radius: 20px;
                text-align: center;
                max-width: 300px;
                box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            ">
                <div style="font-size: 50px; margin-bottom: 20px;">💳</div>
                <h3 style="margin: 0 0 10px 0; color: #333;">Processing Payment</h3>
                <p style="color: #666; margin: 0 0 20px 0; font-size: 24px; font-weight: bold;">$6.99</p >
                <div style="color: #4CAF50; margin-bottom: 15px;">Please authenticate with Touch ID / Face ID</div>
                <div style="width: 50px; height: 50px; border: 3px solid #f3f3f3; border-top: 3px solid #3498db; border-radius: 50%; margin: 0 auto; animation: spin 1s linear infinite;"></div>
            </div>
            <style>
                @keyframes spin {
                    0% { transform: rotate(0deg); }
                    100% { transform: rotate(360deg); }
                }
            </style>
        `;
        document.body.appendChild(overlay);
        
        // 模拟支付处理
        setTimeout(() => {
            // 移除支付界面
            const existingOverlay = document.getElementById('paymentOverlay');
            if (existingOverlay) {
                document.body.removeChild(existingOverlay);
            }
            
            // 模拟成功（实际开发中这里会有真实支付结果）
            resolve();
        }, 1500);
    });
}

// ==================== 页面初始化 ====================

document.addEventListener('DOMContentLoaded', function() {
    console.log("页面加载完成，初始化...");
    
    const applePayContainer = document.getElementById('applePayButton');
    const startButton = document.getElementById('startButton');
    const purchaseStatus = document.getElementById('purchaseStatus');
    
    // 确保所有元素都存在
    if (!applePayContainer || !startButton || !purchaseStatus) {
        console.error("错误：找不到必要的DOM元素！");
        return;
    }
    
    // 检查是否支持Apple Pay
    if (isIOSDevice() && isApplePayAvailable()) {
        console.log("iOS设备支持Apple Pay，显示支付按钮");
        
        // 清空容器，确保没有重复按钮
        applePayContainer.innerHTML = '';
        applePayContainer.style.display = 'block';
        
        // 创建Apple Pay按钮
        const applePayBtn = document.createElement('button');
        applePayBtn.id = 'applePayBtn';
        applePayBtn.innerHTML = '💰 Pay Unlock Kung Fu Game <span style="font-size: 24px; font-weight: bold;">$6.99</span>';
        applePayBtn.style.cssText = `
            background: #FF9800;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 16px 32px;
            font-size: 20px;
            font-weight: 500;
            cursor: pointer;
            margin: 15px auto;
            width: 100%;
            max-width: 250px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: all 0.2s;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            letter-spacing: 0.5px;
            display: block;
        `;
        
        // 按钮悬停效果
        applePayBtn.onmouseover = function() {
            this.style.transform = 'scale(1.02)';
            this.style.boxShadow = '0 6px 15px rgba(0,0,0,0.25)';
        };
        applePayBtn.onmouseout = function() {
            this.style.transform = 'scale(1)';
            this.style.boxShadow = '0 4px 10px rgba(0,0,0,0.2)';
        };
        
        // 添加点击事件 - 只处理支付，不启动游戏
        applePayBtn.addEventListener('click', async function(e) {
            e.stopPropagation(); // 阻止事件冒泡
            
            console.log("Apple Pay button clicked");
            
            // 防止重复点击
            if (this.disabled) return;
            
            // 禁用按钮，显示支付中状态
            this.disabled = true;
            this.style.opacity = '0.7';
            this.innerHTML = '⏳ Processing Pay...';
            
            try {
                // 模拟支付流程
                await simulateApplePayPayment();
                
                // 支付成功后调用处理函数（这个函数会启动游戏）
                await handlePurchaseSuccess();
                
            } catch (error) {
                console.error("Payment failed:", error);
                
                // 恢复按钮状态
                this.disabled = false;
                this.style.opacity = '1';
                this.innerHTML = '💰 Pay Unlock Kung Fu Game <span style="font-size: 24px; font-weight: bold;">$6.99</span>';
                
                // 显示错误提示
                alert("Payment failed, please try again。Error：" + error.message);
            }
        });
        
        applePayContainer.appendChild(applePayBtn);
        
        // 添加安全支付提示
        const securityNote = document.createElement('p');
        securityNote.style.cssText = `
            color: #666;
            font-size: 13px;
            margin: 30px auto 0 auto;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        `;
        securityNote.innerHTML = '🔒 Secure Payment · Use Touch ID / Face ID';
        applePayContainer.appendChild(securityNote);
        
        // 确保开始按钮是隐藏的
        startButton.style.display = 'none';
        
    } else {
        console.log("设备不支持Apple Pay，显示开始按钮");
        
        // 非iOS设备，隐藏支付区域，显示开始按钮
        applePayContainer.style.display = 'none';
        startButton.style.display = 'inline-block';
    }
    
    // 原有的开始按钮点击事件（仅当手动点击时触发）
    startButton.addEventListener('click', async function(e) {
        e.stopPropagation();
        console.log('开始按钮被手动点击');
        
        if (typeof startGame === 'function') {
            await startGame();
        }
    });
});
      
        // 元素获取
        const timerElement = document.getElementById('timer');
        const scoreElement = document.getElementById('score');
        const comboElement = document.getElementById('combo');
        const levelElement = document.getElementById('level');
        const masterMoveDisplay = document.getElementById('masterMoveDisplay');
        const masterMoveEmoji = masterMoveDisplay.querySelector('.emoji');
        const masterMoveText = masterMoveDisplay.querySelector('.text');
        const actionButtons = document.querySelectorAll('.action-button');
        const feedbackDisplay = document.getElementById('feedback');
        const gameOverlay = document.getElementById('gameOverlay');
        const startButton = document.getElementById('startButton');

        // Game music elements
        const gameBgMusic = document.getElementById('game-bg-music');
        const bgMusicToggle = document.getElementById('bgMusicToggle');
        const bgMusicIcon = bgMusicToggle.querySelector('i');
        const bgMusicSelector = document.getElementById('bgMusicSelector');
        gameBgMusic.volume = 0.3;
        let isGameBgMusicPlaying = false;

        // Relax music elements
        const relaxAudio = document.getElementById('relax-audio');
        const relaxPlayButton = document.getElementById('relaxPlayButton');
        const relaxPauseButton = document.getElementById('relaxPauseButton');
        const relaxVolumeSlider = document.getElementById('relaxVolumeSlider');
        const relaxMusicSelector = document.getElementById('relaxMusicSelector');
        relaxAudio.volume = relaxVolumeSlider.value;

        // Game State Variables
        let score = 0;
        let combo = 0;
        let timeLeft = 60;
        let gameInterval;
        let moveInterval;
        let isGameRunning = false;
        let expectedMoveId = null;
        let moveTimeout = null;
        let level = 1;

        // Game Data
        const moves = [
            { id: 'left-punch', emoji: '👊', text: 'Left Punch' },
            { id: 'right-punch', emoji: '🤜', text: 'Right Punch' },
            { id: 'up-kick', emoji: '🤸', text: 'Up Kick' },
            { id: 'down-block', emoji: '🛡️', text: 'Down Block' },
            { id: 'jump', emoji: '⬆️', text: 'Jump' },
            { id: 'crouch', emoji: '⤵️', text: 'Crouch' }
        ];

        const levels = [
            { scoreThreshold: 0, name: 'Apprentice', moveSpeed: 1500 },
            { scoreThreshold: 100, name: 'Bear Trainee', moveSpeed: 1200 },
            { scoreThreshold: 300, name: 'Kung Fu Bear', moveSpeed: 1000 },
            { scoreThreshold: 600, name: 'Disciple Master', moveSpeed: 800 },
            { scoreThreshold: 1000, name: 'Bear Overlord', moveSpeed: 600 }
        ];

        
        const gameMusicList = [
            { name: "Kung Fu Rhythm", src: "https://www.learningcontainer.com/wp-content/uploads/2020/02/Kalimba.mp3" },
            { name: "Exhilarating Strike", src: "music/Exhilarating Strike.mp3" },
            { name: "Mountain Forest Cultivation", src: "music/Mountain Forest Cultivation.mp3" }
        ];

        const relaxMusicList = [
            { name: "Joyful Chirp of Flocking Birds", src: "music/Joyful Chirp of Flocking Birds.mp3" },
            { name: "Mountain Stream's Flow", src: "music/Mountain Stream's Flow.mp3" },
            { name: "Ocean Waves", src: "https://www.bensound.com/bensound-music/bensound-relaxing.mp3" }
        ];

        // Music Playback Helper Functions
        async function loadAndPlayMusic(audioElement, src, shouldPlay) {
            console.log(`Attempting to load: ${src}, Expected to play: ${shouldPlay}`);
            audioElement.src = src;
            audioElement.load();
            if (shouldPlay) {
                try {
                    await new Promise((resolve, reject) => {
                        const onCanPlayThrough = () => {
                            console.log(`Audio canplaythrough: ${src}`);
                            audioElement.removeEventListener('canplaythrough', onCanPlayThrough);
                            audioElement.removeEventListener('loadeddata', onLoadedData);
                            audioElement.removeEventListener('error', onError);
                            resolve();
                        };
                        const onLoadedData = () => {
                            console.log(`Audio loadeddata: ${src}`);
                            audioElement.removeEventListener('canplaythrough', onCanPlayThrough);
                            audioElement.removeEventListener('loadeddata', onLoadedData);
                            audioElement.removeEventListener('error', onError);
                            resolve();
                        };
                        const onError = (e) => {
                            console.error(`Audio error during load/play: ${src}`, e);
                            audioElement.removeEventListener('canplaythrough', onCanPlayThrough);
                            audioElement.removeEventListener('loadeddata', onLoadedData);
                            audioElement.removeEventListener('error', onError);
                            reject(new Error(`Audio load error for ${src}: ${e.message || e.type}`));
                        };
                        audioElement.addEventListener('canplaythrough', onCanPlayThrough);
                        audioElement.addEventListener('loadeddata', onLoadedData);
                        audioElement.addEventListener('error', onError);
                        if (audioElement.readyState >= 4) {
                            onCanPlayThrough();
                        } else if (audioElement.readyState >= 2) {
                            onLoadedData();
                        }
                        setTimeout(() => {
                            reject(new Error(`Audio load timeout for ${src}`));
                        }, 7000);
                    });
                    await audioElement.play();
                    console.log(`Music ${src} played successfully.`);
                    return true;
                } catch (e) {
                    console.warn(`Music playback failed (URL: ${src}), may require user interaction or invalid link/format:`, e);
                    return false;
                }
            }
            return false;
        }

        function populateMusicSelectors() {
            bgMusicSelector.innerHTML = '';
            relaxMusicSelector.innerHTML = '';

            gameMusicList.forEach((music) => {
                const option = document.createElement('option');
                option.value = music.src;
                option.textContent = music.name;
                bgMusicSelector.appendChild(option);
            });

            if (gameMusicList.length > 0) {
                gameBgMusic.src = gameMusicList[0].src;
                gameBgMusic.load();
            }

            relaxMusicList.forEach((music) => {
                const option = document.createElement('option');
                option.value = music.src;
                option.textContent = music.name;
                relaxMusicSelector.appendChild(option);
            });

            if (relaxMusicList.length > 0) {
                relaxAudio.src = relaxMusicList[0].src;
                relaxAudio.load();
            }
        }

        function resetGame() {
            score = 0;
            combo = 0;
            timeLeft = 60;
            level = 1;
            scoreElement.textContent = score;
            comboElement.textContent = combo;
            timerElement.textContent = timeLeft;
            levelElement.textContent = levels[0].name;

            if (gameInterval) {
                clearInterval(gameInterval);
                gameInterval = null;
            }
            if (moveInterval) {
                clearInterval(moveInterval);
                moveInterval = null;
            }
            if (moveTimeout) {
                clearTimeout(moveTimeout);
                moveTimeout = null;
            }
            isGameRunning = false;
            expectedMoveId = null;
            masterMoveDisplay.classList.remove('show');
            feedbackDisplay.classList.remove('show', 'correct', 'wrong', 'combo');
            feedbackDisplay.textContent = '';
            enableActionButtons(true);
            gameBgMusic.pause();
            gameBgMusic.currentTime = 0;
            isGameBgMusicPlaying = false;
            bgMusicIcon.classList.remove('fa-volume-mute');
            bgMusicIcon.classList.add('fa-volume-up');
       
        }

        async function startGame() {
            // 重置计时保护，避免上一局的残留影响
            lastTimerUpdate = 0;
            
            console.log("startGame called.");
            if (isGameRunning) { 
                console.log("Game is already running or starting, ignoring duplicate call.");
                return;
            }
            
            resetGame(); // Reset all states and timers before starting a new game
            
            // Critical: Hide overlay before setting isGameRunning=true, to prevent race conditions
            gameOverlay.classList.add('hidden'); 
            
            // Add a short delay to ensure the browser has time to process DOM updates and rendering
            await new Promise(resolve => setTimeout(resolve, 100)); 

            isGameRunning = true; // Set to true immediately, ensuring updateTimer can execute
            
            try { // Add try-catch block to catch potential errors in setInterval
                gameInterval = setInterval(updateTimer, 1000); // **Ensure this is set only once, with 1000ms interval**
                console.log("Game interval set with ID:", gameInterval); // Print timer ID
            } catch (error) {
                console.error("Failed to set gameInterval:", error);
                // alert("Game failed to start: Timer could not be created. Check browser console.");
                isGameRunning = false; // Reset state if start fails
                gameOverlay.classList.remove('hidden'); // If start fails, re-show Overlay
                return;
            }
            
            startNewMoveSequence();

            // Music playback logic remains unchanged
            if (isGameBgMusicPlaying) {
                await loadAndPlayMusic(gameBgMusic, bgMusicSelector.value, true);
            }
            //relaxAudio.pause();
            console.log("startGame finished. Game is running.");
        }

        let lastTimerUpdate = 0;
        function updateTimer() {
            // 防止setInterval堆积调用
            const now = Date.now();
            if (lastTimerUpdate && now - lastTimerUpdate < 800) {
                // 距离上次更新不足800ms，跳过此次执行
                return;
            }
            lastTimerUpdate = now;
          
            // Only update time if the game is running
            if (!isGameRunning) { 
                if (gameInterval) { // If game stopped but timer is still running, clear it
                    clearInterval(gameInterval);
                    gameInterval = null;
                }
                console.log("updateTimer called but game is not running."); // Debug info
                return;
            }
            timeLeft--;
            timerElement.textContent = timeLeft;
            console.log("Time left:", timeLeft, " (isGameRunning:", isGameRunning, ")"); // Print time to console, observe changes
            if (timeLeft <= 0) {
                endGame();
            }
        }

        function startNewMoveSequence() {
            if (moveInterval) clearInterval(moveInterval); // Ensure old move timer is cleared
            let currentLevelData = levels[0]; 
            for (let i = levels.length - 1; i >= 0; i--) {
                if (score >= levels[i].scoreThreshold) {
                    currentLevelData = levels[i];
                    level = i + 1; 
                    break;
                }
            }
            levelElement.textContent = currentLevelData.name;
            moveInterval = setInterval(showNextMove, currentLevelData.moveSpeed); // Use current level's rhythm
            showNextMove(); 
        }

        function showNextMove() {
            if (!isGameRunning) return;

            clearTimeout(moveTimeout); 

            if (expectedMoveId !== null) {
                handleWrongGuess(null); 
            }
            
            masterMoveDisplay.classList.remove('show'); 
            
            const randomIndex = Math.floor(Math.random() * moves.length);
            const nextMove = moves[randomIndex];

            masterMoveEmoji.textContent = nextMove.emoji;
            masterMoveText.textContent = nextMove.text;
            masterMoveDisplay.classList.add('show');
            
            expectedMoveId = nextMove.id; 

            actionButtons.forEach(button => {
                button.disabled = false;
                button.classList.remove('correct', 'wrong');
            });

            const currentLevelData = levels.find(l => score >= l.scoreThreshold) || levels[levels.length - 1];
            moveTimeout = setTimeout(() => { 
                if (expectedMoveId !== null && isGameRunning) { 
                    handleWrongGuess(null);
                }
            }, currentLevelData.moveSpeed - 200); 
        }

        function handlePlayerAction(event) {
            console.log("Player action clicked. Expected:", expectedMoveId, "Clicked:", event.currentTarget.dataset.action);
            if (!isGameRunning || expectedMoveId === null) {
                console.log("Action ignored: Not running or no expected move.");
                return; 
            }

            clearTimeout(moveTimeout); 
            
            const clickedAction = event.currentTarget.dataset.action;
            const isCorrect = (clickedAction === expectedMoveId); 
            
            expectedMoveId = null; 
            masterMoveDisplay.classList.remove('show'); 
            enableActionButtons(false);

            if (isCorrect) { 
                console.log("Correct!");
                score += (10 + combo * 2); 
                combo++;
                scoreElement.textContent = score;
                comboElement.textContent = combo; 

                if (combo > 1) {
                    showFeedback(`Combo x${combo}!`, 'combo');
                } else {
                    showFeedback('Correct!', 'correct');
                }
                
                const nextLevelThreshold = levels[level] ? levels[level].scoreThreshold : Infinity; 
                if (score >= nextLevelThreshold) {
                    level++; 
                    levelElement.textContent = levels[level-1].name;
                    startNewMoveSequence(); 
                    showFeedback(`Level Up!`, 'combo');
                }
            } else { 
                console.log("Wrong!");
                handleWrongGuess(event.currentTarget);
            }
        }

        function handleWrongGuess(clickedButton) {
            score = Math.max(0, score - 5); 
            combo = 0; 
            scoreElement.textContent = score;
            comboElement.textContent = combo; 
            showFeedback('Wrong!', 'wrong');

            if (clickedButton) {
                clickedButton.classList.add('wrong'); 
            }
            expectedMoveId = null; 
        }

        function showFeedback(text, type) {
            feedbackDisplay.classList.remove('show', 'correct', 'wrong', 'combo');
            feedbackDisplay.textContent = text;
            feedbackDisplay.classList.add('show');
            if (type) {
                feedbackDisplay.classList.add(type);
            }

            setTimeout(() => {
                feedbackDisplay.classList.remove('show');
            }, 1000); 
        }

        function enableActionButtons(enable) {
            actionButtons.forEach(button => {
                button.disabled = !enable;
            });
        }

        function endGame() {
            clearInterval(gameInterval);
            clearInterval(moveInterval);
            clearTimeout(moveTimeout); 
            isGameRunning = false;
            enableActionButtons(false);
            masterMoveDisplay.classList.remove('show'); 
            expectedMoveId = null; 

            gameBgMusic.pause();
            gameBgMusic.currentTime = 0; 
            isGameBgMusicPlaying = false;
            bgMusicIcon.classList.remove('fa-volume-mute');
            bgMusicIcon.classList.add('fa-volume-up');
            gameOverlay.classList.remove('hidden');
            gameOverlay.querySelector('h2').textContent = 'Training Ended!';
            gameOverlay.querySelector('p').textContent = `Your final score is: ${score}, and Bear reached the ${levelElement.textContent} realm!`;
            gameOverlay.querySelector('button').textContent = 'Play Again';
            gameOverlay.classList.add('ended');       
    } 
        
        // --- Event Listeners ---
        actionButtons.forEach(button => {
            button.addEventListener('click', handlePlayerAction);
        });

        bgMusicToggle.addEventListener('click', async () => {
            if (gameBgMusic.paused) {
                const success = await loadAndPlayMusic(gameBgMusic, bgMusicSelector.value, true);
                if (success) {
                    isGameBgMusicPlaying = true;
                    bgMusicIcon.classList.remove('fa-volume-mute');
                    bgMusicIcon.classList.add('fa-volume-up');
                    if (!relaxAudio.paused) {
                        relaxAudio.pause();
                    }
                }
            } else {
                gameBgMusic.pause();
                isGameBgMusicPlaying = false;
                bgMusicIcon.classList.remove('fa-volume-up');
                bgMusicIcon.classList.add('fa-volume-mute');
            }
        });

        bgMusicSelector.addEventListener('change', async (e) => {
            const newSrc = e.target.value;
            const wasPlaying = isGameBgMusicPlaying;
            gameBgMusic.pause();
            gameBgMusic.currentTime = 0;
            const success = await loadAndPlayMusic(gameBgMusic, newSrc, wasPlaying);
            if (success) {
                isGameBgMusicPlaying = true;
                bgMusicIcon.classList.remove('fa-volume-mute');
                bgMusicIcon.classList.add('fa-volume-up');
                if (!relaxAudio.paused) {
                    relaxAudio.pause();
                }
            } else {
                isGameBgMusicPlaying = false;
                bgMusicIcon.classList.remove('fa-volume-up');
                bgMusicIcon.classList.add('fa-volume-mute');
            }
        });

        relaxPlayButton.addEventListener('click', async () => {
            const success = await loadAndPlayMusic(relaxAudio, relaxMusicSelector.value, true);
            if (success) {
                if (!gameBgMusic.paused) {
                    gameBgMusic.pause();
                    isGameBgMusicPlaying = false;
                    bgMusicIcon.classList.remove('fa-volume-up');
                    bgMusicIcon.classList.add('fa-volume-mute');
                }
            }
        });

        relaxPauseButton.addEventListener('click', () => {
            relaxAudio.pause();
        });

        relaxVolumeSlider.addEventListener('input', () => {
            relaxAudio.volume = relaxVolumeSlider.value;
        });

        relaxMusicSelector.addEventListener('change', async (e) => {
            const newSrc = e.target.value;
            const wasRelaxPlaying = !relaxAudio.paused;
            relaxAudio.pause();
            relaxAudio.currentTime = 0;
            const success = await loadAndPlayMusic(relaxAudio, newSrc, wasRelaxPlaying);
            if (success) {
                if (!gameBgMusic.paused) {
                    gameBgMusic.pause();
                    isGameBgMusicPlaying = false;
                    bgMusicIcon.classList.remove('fa-volume-up');
                    bgMusicIcon.classList.add('fa-volume-mute');
                }
            }
        });

      // --- Initial Setup ---
        document.addEventListener('DOMContentLoaded', () => {
            populateMusicSelectors();
            gameOverlay.classList.remove('hidden'); 
            startButton.addEventListener('click', startGame);
